name: maize_leaf_prediction
description: Offline-first maize leaf disease detection with TensorFlow Lite.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  camera: ^0.11.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  tflite_flutter: ^0.11.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  image: ^4.5.4
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.3.1
  share_plus: ^10.1.2
  shared_preferences: ^2.5.4
  open_filex: ^4.5.0
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/playstore.png
    - assets/splash.png
    - assets/config/disease_catalog.json
    - assets/models/maize_model.tflite
    - assets/models/labels.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/playstore.png
  adaptive_icon_foreground: assets/playstore.png
  adaptive_icon_background: "#E8F5E9"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#EAF8E7"
  image: assets/splash.png
  android_12:
    color: "#EAF8E7"
    image: assets/splash.png
